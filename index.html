CREATE TABLE IF NOT EXISTS public.survey_responses (
    id TEXT PRIMARY KEY,
    created_at TIMESTAMP WITH TIME ZONE DEFAULT timezone('utc'::text, now()) NOT NULL,
    q1_role TEXT NOT NULL,
    q2_age_range TEXT NOT NULL,
    q3_hours_on_campus TEXT NOT NULL,
    q4_physical_activity_minutes TEXT NOT NULL,
    q5_sitting_hours TEXT NOT NULL,
    q6_stairs_vs_elevator TEXT NOT NULL,
    q7_activity_timing TEXT NOT NULL,
    q8_barriers JSONB NOT NULL DEFAULT '[]'::jsonb,
    q9_most_important_barrier TEXT NOT NULL,
    q10_facilities_rating INTEGER NOT NULL CHECK (q10_facilities_rating BETWEEN 1 AND 5),
    q11_motivators JSONB NOT NULL DEFAULT '[]'::jsonb,
    q12_willingness_short_activity TEXT NOT NULL,
    q13_campus_idea TEXT DEFAULT ''
);

-- Enable Row Level Security (RLS)
ALTER TABLE public.survey_responses ENABLE ROW LEVEL SECURITY;

-- Allow anonymous inserts for survey submissions
CREATE POLICY "Allow public anonymous survey submissions" 
ON public.survey_responses 
FOR INSERT 
TO anon, authenticated
WITH CHECK (true);

-- Allow public read access to aggregated responses for results dashboard
CREATE POLICY "Allow public read access to survey responses" 
ON public.survey_responses 
FOR SELECT 
TO anon, authenticated
USING (true);

-- Create performance indexes
